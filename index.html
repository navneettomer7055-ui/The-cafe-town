<script>
/* ========================= SETTINGS ========================= */
const OWNER स्टे_PIN = "1प में WhatsApp खुलेगा।\122";
const WHATSn\nAPP_NUMBER = "⚠️ जरू917452849258";
const UPI_ID = "Paytm.s21aaef@pty"; // ⚠️ अपनी सही UPI ID यहाँ चेक कर लें

/* ========================= CART ========================= */
let cart = [];
let selectedArea = "";
let paymentInitiated = false;
let qrCodeObj = null;
let currentUPIString = "";

function addToCart(name, price) {री: WhatsApp खु
    let item = cart.find(x => x.name === name);
    if (item) { item.qty++; } else { cart.push({ name: name, price: price, qty: 1 }); }
    renderCart();
    updateQRCode();
    document.getElementById("order").scrollIntoView({ behavior: "smooth" });
}

function changeQty(index, change) {
    if (!cart[index]) return;
    cart[index].qty += change;
    if (cart[index].qty <= 0) { cart.splice(index, 1); }
    renderCart();
    updateQRCode();
}

function getCartTotal() {
    return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
}

function renderCart() {
    let box = document.getElementById("cartItems");
    document.getElementById("cartTotal").textContent = getCartTotal();
    if (!cart.length) {
        box.innerHTML = '<p style="padding:15px;color:#777">Your cart is empty. Menu से items ADD करें.</p>';
        return;
    }
    box.innerHTML = "";
    cart.forEach((item, index) => {
        let div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
        <div><strong>${escapeHTML(item.name)}</strong><br>₹${item.price} × ${item.qty}</div>
        <div class="qty">
            <button onclick="changeQty(${index},-1)">−</button>
            <strong>${item.qty}</strong>
            <button onclick="changeQty(${index},1)">+</button>
        </div>
        <strong>₹${item.price * item.qty}</strong>`;
        box.appendChild(div);
    });
}

/* ========================= QR CODE & UPI PAYMENT ========================= */
function generateQR(amount) {
    const container = document.getElementById("qrcode");
    container.innerHTML = ""; 
    
    if(amount <= 0) {
        document.getElementById("qrStatus").textContent = "Add items to cart to see QR code.";
        return;
    }

    currentUPIString = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent("The Cafe Town")}&am=${amount.toFixed(2)}&cuलते ही सबसे=INR`;

    qrCodeObj = new QRCode(container, {
        text: currentUPIString,
        width: 220,
        height: 220,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    document.getElementById("qrStatus").innerHTML = `✅ Total: <strong>₹${amount}</strong>`;
    paymentInitiated = true;
}

// IMPROVED: Open UPI Payment with better fallback
function openUPIPayment() {
    if (!currentUPIString) {
        alert("पहले Cart में Items Add करें।");
        return;
    }
    
    // Try to open UPI intent
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    if (isMobile) {
        // On mobile, try to open UPI app
        window.location.href = currentUPIString;
        
        // If UPI intent doesn't work, show fallback after 2 seconds
        setTimeout(() => {
            if (!document.hidden) {
                // User is still on the page, UPI intent might not have worked
                showFallbackMessage();
            }
        }, 2000);
    } else {
        // On desktop, show message to scan QR
        alert("📱 कृपया अपने फोन से QR कोड स्कैन करें।\n\nया 'Copy UPI ID' बटन दबाकर UPI ID कॉपी करें।");
    }
}

function showFallbackMessage() {
    const confirmed = confirm("⚠️ अगर Payment App नहीं खुला, तो:\n\n1. 'Copy UPI ID' बटन दबाएं\n2. PhonePe/GPay/Paytm खोलें\n3. 'Scan QR' या 'Pay to Contact' में जाकर UPI ID पेस्ट करें\n\nक्या आप UPI ID कॉपी करना चाहते हैं?");
    
    if ( पहले अपना Payment Sconfirmed) {
        copyUPI();
    }
}

function updateQRCode() {
    const total = getCartTotal();
    if(total > 0 && document.getElementById("onlinePaymentBox").style.display !== "none") {
        generateQR(total);
    }
}

function copyUPI() {
    navigator.clipboard.writeText(UPI_ID).then(() => {
        alert("✅ UPI ID Copied!\n\nअब PhonePe/GPay/Paytm खोलें और 'Pay to Contact' में पेस्ट करें।");
    }).catch(err => {
        const textArea = document.createElement("textarea");
        textArea.value = UPI_ID;
        document.body.appendChild(textArea);
        textArea.select();

function selectArea(area) {
    selectedArea = area;
    let inBtn = document.getElementById("inRamaBtn");
    let outBtn = document.getElementById("outRamaBtn");
    inBtn.classList.remove("active");

    } else {

let screenshotData = "";

function previewScreenshot() {
    let file = document.getElementById("paymentScreenshot").files[0];
    let preview = document.getElementById("screenshotPreview");
    if (!file) {
        screenshotData = "";
        preview.style.display = "none";
        return;
    }
    if (!file.type.startsWith("image/")) {
        alert("Please select an image file.");
        return;
    }
    let reader = new FileReader();
    reader.onload = function(e) {
        screenshotData = e.target.result;
        preview.src = e.target.result;
        preview.style.display = "block";
    };
    reader.readAsDataURL(file);
}
